[package]
name = "wonb-verify-ref"
version = "0.1.0"
edition = "2021"
description = "Verificador de referencia (hash JCS + Ed25519) para bundles contracts/v1. Prueba cruzada Python/Rust."

[dependencies]
serde_json = "1"

[workspace]
resolver = "2"
members = [
    "crates/wombat-core",
    "crates/wombat-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.47", features = ["tcp-tokio", "dns-tokio", "noise", "yamux", "identify", "ping", "gossipsub"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
core2 = "0.4.1"

[profile.release]
opt-level = 2
debug = false
lto = false
panic = "abort"

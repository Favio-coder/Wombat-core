[package]
name = "wombat-node"
description = "Nodo P2P WOMBAT: libp2p + GossipSub, CLI y validación de WONBs"
version.workspace = true
edition.workspace = true

[dependencies]
wombat-core = { path = "../wombat-core" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "ed25519"], optional = true }

[features]
default = []
p2p = ["dep:chrono", "dep:futures-util", "dep:libp2p"]

[dev-dependencies]
tempfile = { workspace = true }

name: CI contratos v1

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  bundle-python:
    name: Bundle fixture — esquemas, sha256, firmas (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install jsonschema referencing cryptography
      - name: Verificar bundle fixture
        run: python3 contracts/v1/tools/verify_bundle.py contracts/v1/fixtures/bundle/piura-demo/v0
      - name: Verificar cada bundle versionado en data/ (si existe)
        run: |
          shopt -s nullglob
          for d in data/*/v*/; do python3 contracts/v1/tools/verify_bundle.py "$d"; done

  bundle-rust:
    name: Prueba cruzada — verificador Rust (JCS + Ed25519)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # rama stable, sin tag
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            contracts/v1/tools/verify-rs/target
          key: ${{ runner.os }}-verifyrs-${{ hashFiles('contracts/v1/tools/verify-rs/Cargo.toml') }}
      - run: cargo run --release --manifest-path contracts/v1/tools/verify-rs/Cargo.toml -- contracts/v1/fixtures/bundle/piura-demo/v0

  bundle-js:
    name: Prueba cruzada — verificador JS (JCS + Ed25519)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20' }
      - working-directory: contracts/v1/tools/verify-js
        run: npm ci && node verify.mjs ../../fixtures/bundle/piura-demo/v0

  immutable-bundles:
    name: R28 — los bundles publicados son inmutables
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Rechazar modificaciones o borrados en data/<aoi>/<vN>/
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- data/ | grep -E '^(M|D|R)' || true)
          if [ -n "$changed" ]; then echo "R28: no se modifican bundles ya publicados. Publica una versión nueva."; echo "$changed"; exit 1; fi

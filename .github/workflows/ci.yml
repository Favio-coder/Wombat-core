name: CI WOMBAT

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4f366e621dc797ca1b35e7bd81a7f017cc10e7c0 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4 # TODO: pin to SHA — currently uses floating tag v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  fixtures:
    name: Fixture validation
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4f366e621dc797ca1b35e7bd81a7f017cc10e7c0 # stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4 # TODO: pin to SHA — currently uses floating tag v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace

      - name: Validate all valid fixtures
        run: |
          for f in contracts/fixtures/*-valid.json; do
            echo "Validando $f"
            cargo run -p wombat-node -- validate --file "$f"
          done

      - name: Negative validation of invalid fixtures
        run: |
          for f in contracts/fixtures/*-invalid.json; do
            echo "Rechazando (esperado) $f"
            set +e
            cargo run -p wombat-node -- validate --file "$f" >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "ERROR: $f debería haberse rechazado pero fue aceptado"
              exit 1
            fi
          done

name: Release WOMBAT node

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing v* tag to build and publish
        required: true
        type: string

jobs:
  build-linux:
    name: Build Linux x86_64 package
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Validate release tag
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build WOMBAT node
        run: cargo build --release --locked -p wombat-node --features p2p

      - name: Package Linux x86_64 distribution
        run: |
          package_dir="$RUNNER_TEMP/wombat-node-linux-x86_64"
          mkdir -p "$package_dir"
          install -m 0755 target/release/wombat-node "$package_dir/wombat-node"
          install -m 0644 config/trusted-issuers.json "$package_dir/trusted-issuers.json"
          install -m 0644 crates/wombat-node/release/relay.env.example "$package_dir/relay.env.example"
          install -m 0644 crates/wombat-node/release/README.md "$package_dir/README.md"
          (
            cd "$package_dir"
            sha256sum wombat-node trusted-issuers.json relay.env.example README.md > SHA256SUMS
          )
          tar -czf "$GITHUB_WORKSPACE/wombat-node-linux-x86_64.tar.gz" \
            -C "$RUNNER_TEMP" \
            wombat-node-linux-x86_64

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: wombat-node-linux-x86_64-release
          path: wombat-node-linux-x86_64.tar.gz
          if-no-files-found: error

  build-gateway-linux:
    name: Build Linux x86_64 gateway package
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Validate release tag
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build WOMBAT gateway
        run: cargo build --release --locked -p wombat-gateway

      - name: Package Linux x86_64 gateway distribution
        run: |
          package_dir="$RUNNER_TEMP/wombat-gateway-linux-x86_64"
          mkdir -p "$package_dir"
          install -m 0755 target/release/wombat-gateway "$package_dir/wombat-gateway"
          install -m 0644 crates/wombat-gateway/README.md "$package_dir/README.md"
          install -m 0644 crates/wombat-gateway/release/wombat-gateway.service.example "$package_dir/wombat-gateway.service.example"
          (
            cd "$package_dir"
            sha256sum wombat-gateway README.md wombat-gateway.service.example > SHA256SUMS
          )
          tar -czf "$GITHUB_WORKSPACE/wombat-gateway-linux-x86_64.tar.gz" \
            -C "$RUNNER_TEMP" \
            wombat-gateway-linux-x86_64

      - name: Upload Linux gateway package
        uses: actions/upload-artifact@v4
        with:
          name: wombat-gateway-linux-x86_64-release
          path: wombat-gateway-linux-x86_64.tar.gz
          if-no-files-found: error

  build-linux-aarch64:
    name: Build Linux ARM64 package
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Validate release tag
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # rama stable, sin tag

      - name: Build WOMBAT node
        run: cargo build --release --locked -p wombat-node --features p2p

      - name: Verify Linux ARM64 binary
        run: |
          file target/release/wombat-node | tee "$RUNNER_TEMP/wombat-node-file.txt"
          grep -F 'ARM aarch64' "$RUNNER_TEMP/wombat-node-file.txt"

      - name: Package Linux ARM64 distribution
        run: |
          package_dir="$RUNNER_TEMP/wombat-node-linux-aarch64"
          mkdir -p "$package_dir"
          install -m 0755 target/release/wombat-node "$package_dir/wombat-node"
          install -m 0644 config/trusted-issuers.json "$package_dir/trusted-issuers.json"
          install -m 0644 crates/wombat-node/release/README.md "$package_dir/README.md"
          install -m 0644 crates/wombat-node/release/relay.env.example "$package_dir/relay.env.example"
          (
            cd "$package_dir"
            sha256sum wombat-node trusted-issuers.json README.md relay.env.example > SHA256SUMS
          )
          tar -czf "$GITHUB_WORKSPACE/wombat-node-linux-aarch64.tar.gz" \
            -C "$RUNNER_TEMP" \
            wombat-node-linux-aarch64

      - name: Upload Linux ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: wombat-node-linux-aarch64-release
          path: wombat-node-linux-aarch64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64 package
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Validate release tag
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG.StartsWith('v')) {
            Write-Error "Release tag must start with v: $env:RELEASE_TAG"
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build WOMBAT node
        run: cargo build --release -p wombat-node --features p2p

      - name: Package Windows x86_64 distribution
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "wombat-node-windows-x86_64"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target\release\wombat-node.exe" (Join-Path $packageDir "wombat-node.exe")
          Copy-Item "config\trusted-issuers.json" (Join-Path $packageDir "trusted-issuers.json")
          Copy-Item "crates\wombat-node\release\README.md" (Join-Path $packageDir "README.md")
          Copy-Item "crates\wombat-node\release\relay.env.example" (Join-Path $packageDir "relay.env.example")

          $files = @("wombat-node.exe", "trusted-issuers.json", "README.md", "relay.env.example")
          $checksums = foreach ($file in $files) {
            $path = Join-Path $packageDir $file
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          Set-Content -LiteralPath (Join-Path $packageDir "SHA256SUMS") -Value $checksums -Encoding ascii

          Compress-Archive `
            -Path (Join-Path $packageDir "*") `
            -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "wombat-node-windows-x86_64.zip") `
            -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: wombat-node-windows-x86_64-release
          path: wombat-node-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    runs-on: ubuntu-22.04
    needs: [build-linux, build-linux-aarch64, build-windows, build-gateway-linux]
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: wombat-*-release
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: WOMBAT node ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/wombat-node-linux-x86_64.tar.gz
            release-assets/wombat-node-linux-aarch64.tar.gz
            release-assets/wombat-node-windows-x86_64.zip
            release-assets/wombat-gateway-linux-x86_64.tar.gz

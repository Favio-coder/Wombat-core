name: CI pipeline de datos

# El pipeline de validación tiene pruebas con datos sintéticos (00_grid hasta
# 06_cells, incluida la exposición vial) que hasta ahora solo corrían en la
# máquina de quien se acordara. Esto las pone en el CI.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pipeline-pytest:
    name: Pipeline de datos — pytest (datos sintéticos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/validacion/requirements.txt
      - run: pip install -r data-pipeline/validacion/requirements.txt
      - run: python -m pytest data-pipeline/validacion -q
